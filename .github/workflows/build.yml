name: Build Godot APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project ZIP & Download Godot
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            for f in *.zip; do
              if [[ "$f" != "godot.zip" ]]; then
                unzip -q "$f" -d extracted_game
              fi
            done
          fi

          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot

          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable/

      - name: Find Project and Export APK
        run: |
          PROJECT_FILE=$(find . -name "project.godot" | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "خطأ: لم يتم العثور على ملف project.godot!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "تم العثور على المشروع في المجلد: $PROJECT_DIR"

          mkdir -p "$PROJECT_DIR/.godot/editor"
          ABS_BUILD_DIR="$(pwd)/build"
          mkdir -p "$ABS_BUILD_DIR"

          # إعداد التصدير ليخرج بصيغة APK
          echo "[preset.0]" > "$PROJECT_DIR/export_presets.cfg"
          echo 'name="Android"' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'platform="Android"' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'runnable=true' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'custom_features=""' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'export_filter="all_resources"' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'include_filter=""' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'exclude_filter="res://addons/AdmobPlugin/*,res://gdscript/sample/*"' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'export_path="game.apk"' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'encryption_include_filters=""' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'encryption_exclude_filters=""' >> "$PROJECT_DIR/encrypt_pck=false' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'encrypt_directory=false' >> "$PROJECT_DIR/export_presets.cfg"
          echo "" >> "$PROJECT_DIR/export_presets.cfg"
          echo "[preset.0.options]" >> "$PROJECT_DIR/export_presets.cfg"
          echo 'custom_template/debug=""' >> "$PROJECT_DIR/export_presets.cfg"
          echo 'custom_template/release=""' >> "$PROJECT_DIR/export_presets.cfg"

          chmod -R 777 .
          
          # استخدام --export-debug لتوليد ملف APK قابل للتثبيت مباشرة
          ./godot --path "$PROJECT_DIR" --headless --export-debug "Android" "$ABS_BUILD_DIR/game.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
