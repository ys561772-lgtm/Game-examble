name: Build Godot APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot

          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable/

      - name: Check Files & Create Preset
        run: |
          mkdir -p .godot/editor
          mkdir -p build
          chmod -R 777 .
          
          echo "Listing project files:"
          ls -la

          echo "[preset.0]" > export_presets.cfg
          echo 'name="Android"' >> export_presets.cfg
          echo 'platform="Android"' >> export_presets.cfg
          echo 'runnable=true' >> export_presets.cfg
          echo 'custom_features=""' >> export_presets.cfg
          echo 'export_filter="all_resources"' >> export_presets.cfg
          echo 'include_filter=""' >> export_presets.cfg
          echo 'exclude_filter=""' >> export_presets.cfg
          echo 'export_path="build/game.pck"' >> export_presets.cfg
          echo 'encryption_include_filters=""' >> export_presets.cfg
          echo 'encryption_exclude_filters=""' >> export_presets.cfg
          echo 'encrypt_pck=false' >> export_presets.cfg
          echo 'encrypt_directory=false' >> export_presets.cfg
          echo "" >> export_presets.cfg
          echo "[preset.0.options]" >> export_presets.cfg
          echo 'custom_template/debug=""' >> export_presets.cfg
          echo 'custom_template/release=""' >> export_presets.cfg

      - name: Export Game
        run: |
          ./godot --path . --headless --export-pack "Android" build/game.pck

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-pck
          path: build/game.pck
