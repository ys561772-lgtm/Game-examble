name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # هذه الخطوة تنشئ إعدادات تصدير افتراضية إذا لم يجد السيرفر ملفك
      - name: Create export_presets.cfg
        run: |
          echo '[preset.0]
          name="Android"
          platform="Android"
          export_path="game.apk"' > export_presets.cfg

      - name: Godot Export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.2.1/Godot_v4.2.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.2.1/Godot_v4.2.1-stable_export_templates.tpz
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: ./**/*.apk
