name: Build Godot APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project ZIP & Download Godot
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            for f in *.zip; do
              if [[ "$f" != "godot.zip" ]]; then
                unzip -q "$f" -d extracted_game
              fi
            done
          fi

          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot

          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable/

      - name: Find Project and Export
        run: |
          PROJECT_FILE=$(find . -name "project.godot" | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "خطأ: لم يتم العثور على ملف project.godot!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "تم العثور على المشروع في المجلد: $PROJECT_DIR"

          mkdir -p "$PROJECT_DIR/.godot/editor"
          ABS_BUILD_DIR="$(pwd)/build"
          mkdir -p "$ABS_BUILD_DIR"

          # كتابة إعدادات التصدير مع استثناء مجلدات الأخطاء (مثل Admob والـ samples) لتجنب توقف المحرك
          cat << 'EOF' > "$PROJECT_DIR/export_presets.cfg"
[preset.0]
name="Android"
platform="Android"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="res://addons/AdmobPlugin/*,res://gdscript/sample/*"
export_path="game.pck"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
EOF

          chmod -R 777 .
          
          # تشغيل التصدير بشكل نظيف
          ./godot --path "$PROJECT_DIR" --headless --export-pack "Android" "$ABS_BUILD_DIR/game.pck"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-pck
          path: build/game.pck
