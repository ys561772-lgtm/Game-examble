name: Build Godot APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot

          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Workspace and Presets
        run: |
          # إنشاء مجلدات النظام والصلاحيات مسبقاً لمنع خطأ الكتابة
          mkdir -p .godot/editor
          chmod -R 777 .

          # إنشاء ملف إعدادات التصدير بصيغة صحيحة 100%
          echo '[preset.0]
          name="Android"
          platform="Android"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/game.pck"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]' > export_presets.cfg

      - name: Export Game
        run: |
          mkdir -p build
          # إضافة --path . لتوجيه المحرك للمشروع مباشرة
          ./godot --path . --headless --export-pack "Android" build/game.pck

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-pck
          path: build/game.pck
