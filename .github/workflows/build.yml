name: Build Godot APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot

          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip Godot_v4.7-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.stable/

      - name: Export Game
        run: |
          mkdir -p build
          ./godot --headless --export-pack "Android" build/game.pck

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-pck
          path: build/game.pck
